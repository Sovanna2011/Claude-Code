<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sugarcane Planting Planning Management System</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui">
            <div style="text-align:center">
                <div class="spinner-border text-success" role="status"></div>
                <p style="margin-top:1rem;color:#546e7a">Loading the planning workspace…</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <!-- The #[.{fingerprint}] placeholder is required: publish renames this file to
         blazor.webassembly.<hash>.js, and OverrideHtmlAssetPlaceholders rewrites the tag to
         match. Hard-coding the plain name works under `dotnet run` but 404s in every published
         deployment, leaving the app stuck on "Loading the planning workspace…". -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
