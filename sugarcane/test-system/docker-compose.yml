name: sugarcane-test

# A complete, disposable instance of the planning system: SQL Server, the API and the Blazor
# client, seeded with the demo tenant. Everything is throw-away — `docker compose down -v`
# removes the database with it. Not a production topology: the passwords and the JWT signing
# key are fixed and public, so never expose these ports beyond localhost.

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sugarcane-test-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Sugarcane#2026dev}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:11433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      # The API must not start migrating before the engine accepts logins, or the first
      # connection fails and the container restarts into a half-created database.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: test-system/api.Dockerfile
      network: host                 # so restore can reach a proxy listening on the host
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: sugarcane-test-api
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development          # serves Swagger at /swagger
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SugarcanePlanning: "Server=sql,1433;Database=SugarcanePlanning;User Id=sa;Password=${SA_PASSWORD:-Sugarcane#2026dev};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
      Database__MigrateOnStartup: "true"
      Database__SeedSampleData: "true"
      Jwt__SigningKey: "sugarcane-test-system-signing-key-not-for-production"
      # The browser loads the client from :5150 and calls the API on :5100, so the two are
      # different origins and the client's address has to be allowed explicitly.
      Cors__AllowedOrigins__0: "http://localhost:5150"
    ports:
      - "127.0.0.1:5100:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s        # first start applies the migration and seeds the demo tenant

  client:
    build:
      context: ..
      dockerfile: test-system/client.Dockerfile
      network: host
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    container_name: sugarcane-test-client
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5150:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/index.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  sqldata:
