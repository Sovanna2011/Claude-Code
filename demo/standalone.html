<title>HR Module — HCM Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ===================================================================
   HR Module — self-contained demo (SAP Fiori "Horizon"-inspired)
   All data + business logic run in the browser; nothing is fetched.
   =================================================================== */
:root{
  --accent:#0064d9; --accent-strong:#0a4bb0; --accent-soft:#e5eefc;
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f6f8f9; --surface-3:#eef2f4;
  --border:#d3dbe0; --border-strong:#b9c4cc;
  --text:#1a2733; --muted:#56646f; --faint:#8592a0;
  --good:#107e3e; --good-bg:#e6f3ea; --warn:#c25400; --warn-bg:#fcefe3;
  --bad:#bb0000; --bad-bg:#fbe8e8; --info:#0070f2;
  --shadow-sm:0 1px 2px rgba(20,40,60,.08);
  --shadow:0 2px 4px rgba(20,40,60,.08),0 6px 20px rgba(20,40,60,.06);
  --radius:12px; --radius-sm:8px;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --accent:#4db1ff; --accent-strong:#7cc6ff; --accent-soft:#122a44;
    --bg:#0f151b; --surface:#1b2531; --surface-2:#202c3a; --surface-3:#25333f;
    --border:#31404e; --border-strong:#425364;
    --text:#e7ecf0; --muted:#9fb0bd; --faint:#6f808e;
    --good:#4bb97a; --good-bg:#12261a; --warn:#f0904a; --warn-bg:#2c1e12;
    --bad:#ff6b6b; --bad-bg:#2c1414; --info:#4db1ff;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 2px 4px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="light"]{
  --accent:#0064d9; --accent-strong:#0a4bb0; --accent-soft:#e5eefc;
  --bg:#eef1f3; --surface:#fff; --surface-2:#f6f8f9; --surface-3:#eef2f4;
  --border:#d3dbe0; --border-strong:#b9c4cc;
  --text:#1a2733; --muted:#56646f; --faint:#8592a0;
  --good:#107e3e; --good-bg:#e6f3ea; --warn:#c25400; --warn-bg:#fcefe3;
  --bad:#bb0000; --bad-bg:#fbe8e8; --info:#0070f2;
  --shadow-sm:0 1px 2px rgba(20,40,60,.08);
  --shadow:0 2px 4px rgba(20,40,60,.08),0 6px 20px rgba(20,40,60,.06);
}
:root[data-theme="dark"]{
  --accent:#4db1ff; --accent-strong:#7cc6ff; --accent-soft:#122a44;
  --bg:#0f151b; --surface:#1b2531; --surface-2:#202c3a; --surface-3:#25333f;
  --border:#31404e; --border-strong:#425364;
  --text:#e7ecf0; --muted:#9fb0bd; --faint:#6f808e;
  --good:#4bb97a; --good-bg:#12261a; --warn:#f0904a; --warn-bg:#2c1e12;
  --bad:#ff6b6b; --bad-bg:#2c1414; --info:#4db1ff;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 4px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---- ShellBar ---- */
.shell{position:sticky;top:0;z-index:20;background:var(--accent-strong);
  color:#fff;display:flex;align-items:center;gap:18px;
  padding:0 16px;height:52px;box-shadow:var(--shadow-sm)}
:root[data-theme="dark"] .shell,
@media (prefers-color-scheme:dark){.shell{background:#0c1620}}
:root[data-theme="dark"] .shell{background:#0c1620}
.shell .logo{display:flex;align-items:center;gap:10px;font-weight:700;
  letter-spacing:.2px;white-space:nowrap}
.shell .logo .mark{width:26px;height:26px;border-radius:6px;background:#fff;
  color:var(--accent-strong);display:grid;place-items:center;font-weight:800;font-size:13px}
.shell .sub{font-weight:400;opacity:.8;font-size:12px;border-left:1px solid rgba(255,255,255,.3);
  padding-left:12px;margin-left:2px}
.shell nav{display:flex;gap:2px;margin-left:8px}
.shell nav button{background:transparent;border:0;color:#fff;opacity:.82;
  padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13.5px;font-weight:600;
  display:flex;align-items:center;gap:7px}
.shell nav button:hover{opacity:1;background:rgba(255,255,255,.12)}
.shell nav button.active{opacity:1;background:rgba(255,255,255,.18)}
.shell .spacer{flex:1}
.shell .util{display:flex;gap:6px;align-items:center}
.shell .util button{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:34px;
  border-radius:8px;cursor:pointer;display:grid;place-items:center;font-size:15px}
.shell .util button:hover{background:rgba(255,255,255,.22)}
.shell nav svg,.shell .util svg{width:16px;height:16px;fill:currentColor}

/* ---- Layout ---- */
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.page-head h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.2px}
.page-head .crumb{font-size:12px;color:var(--muted);margin-bottom:3px;
  text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
input,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 10px}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.search{position:relative;flex:1;min-width:220px}
.search input{width:100%;padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:var(--faint)}

/* ---- Buttons ---- */
.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn svg{width:15px;height:15px;fill:currentColor}
.btn.sm{padding:6px 10px;font-size:12.5px}

/* ---- Card / table ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);
  background:var(--surface-2)}
.card-head h2{font-size:14px;margin:0;font-weight:700}
.card-head .count{background:var(--accent-soft);color:var(--accent);font-weight:700;
  border-radius:20px;padding:2px 10px;font-size:12px}
.card-head .spacer{flex:1}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
  font-weight:700;padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{cursor:default}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.th-r,.td-r{text-align:right}
.pernr{font-weight:700;color:var(--accent)}
a.mail{color:var(--accent);text-decoration:none}
a.mail:hover{text-decoration:underline}

/* ---- Status pill ---- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);background:var(--good-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.bad{color:var(--bad);background:var(--bad-bg)}
.pill.neutral{color:var(--muted);background:var(--surface-3)}

/* ---- Object header (detail) ---- */
.obj-head{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow-sm);margin-bottom:14px;
  display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:800;font-size:20px;flex:0 0 auto}
.obj-head .id{margin-left:auto;text-align:right}
.obj-head .id .n{font-size:24px;font-weight:800;color:var(--accent)}
.obj-head .id .l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.obj-head h1{margin:0 0 4px;font-size:22px;letter-spacing:-.3px}
.obj-head .attrs{display:flex;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.obj-head .attrs b{color:var(--text);font-weight:600}

/* ---- Tabs ---- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);
  padding:10px 14px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap;
  display:flex;align-items:center;gap:8px}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button .ico{width:26px;height:26px;border-radius:50%;background:var(--surface-3);color:var(--muted);
  display:grid;place-items:center}
.tabs button.active .ico{background:var(--accent);color:#fff}
.tabs svg{width:14px;height:14px;fill:currentColor}

/* ---- Definition grid ---- */
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
  font-weight:700;margin:4px 0 10px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 40px}
@media (max-width:680px){.dl{grid-template-columns:1fr}}
.dl .row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--surface-3)}
.dl .row dt{color:var(--muted)}
.dl .row dd{margin:0;font-weight:600;text-align:right}
.subcard{padding:16px 18px}
.subcard+.subcard{border-top:1px solid var(--border)}

/* ---- Org tree ---- */
.tree{padding:6px}
.node{border-radius:var(--radius-sm)}
.node .bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer}
.node .bar:hover{background:var(--surface-2)}
.node .tog{width:18px;height:18px;flex:0 0 auto;display:grid;place-items:center;color:var(--muted);
  transition:transform .15s}
.node.open>.bar .tog{transform:rotate(90deg)}
.node .tog.leaf{visibility:hidden}
.node .oic{width:30px;height:30px;border-radius:7px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;flex:0 0 auto}
.node .oic svg{width:16px;height:16px;fill:currentColor}
.node .meta{display:flex;flex-direction:column}
.node .meta .nm{font-weight:700}
.node .meta .dt{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.node .children{margin-left:26px;padding-left:14px;border-left:1px dashed var(--border-strong);display:none}
.node.open>.children{display:block}
.hc{display:inline-flex;align-items:center;gap:5px;color:var(--info);font-weight:700}
.hc svg{width:13px;height:13px;fill:currentColor}

/* ---- Modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,35,.45);backdrop-filter:blur(2px);
  display:grid;place-items:center;z-index:50;padding:16px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  width:min(520px,100%);max-height:90vh;display:flex;flex-direction:column;animation:pop .18s ease}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--border);font-size:16px}
.modal .body{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal .foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;
  background:var(--surface-2)}
.modal .grp{display:flex;flex-direction:column;gap:5px}
.modal .grp label{font-size:12px;color:var(--muted);font-weight:600}
.modal .grp label .req{color:var(--bad)}
.modal .grp input,.modal .grp select{width:100%}
.modal .hint{font-size:12.5px;color:var(--muted);background:var(--surface-3);border-radius:var(--radius-sm);
  padding:9px 12px;display:flex;gap:8px;align-items:flex-start}
.modal .hint svg{width:15px;height:15px;fill:var(--info);flex:0 0 auto;margin-top:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .grp.sec{margin-top:2px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--accent);font-weight:700;border-top:1px solid var(--border);padding-top:12px}

/* ---- Toast ---- */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#0c1620;color:#fff;padding:11px 18px;border-radius:24px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow);display:flex;gap:9px;align-items:center;animation:up .2s ease}
.toast.good{background:var(--good)}.toast.bad{background:var(--bad)}
.toast svg{width:16px;height:16px;fill:currentColor}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

.banner{background:var(--accent-soft);color:var(--accent-strong);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 14px;font-size:12.5px;margin-bottom:14px;display:flex;gap:9px;align-items:center}
:root[data-theme="dark"] .banner{color:var(--accent)}
.banner svg{width:16px;height:16px;fill:currentColor;flex:0 0 auto}
.empty{padding:40px;text-align:center;color:var(--muted)}
.whoami{display:flex;flex-direction:column;line-height:1.15;text-align:right;margin-right:4px}
.whoami b{font-size:12.5px}.whoami span{font-size:11px;opacity:.8}
.rolebadge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
/* Login */
.login-wrap{min-height:calc(100vh - 52px);display:grid;place-items:center;padding:24px}
.login{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
  width:min(400px,100%);padding:30px 28px}
.login .brandrow{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.login .brandrow .mark{width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.login h1{font-size:20px;margin:0}
.login .tag{color:var(--muted);font-size:13px;margin:2px 0 22px}
.login .grp{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.login .grp label{font-size:12px;color:var(--muted);font-weight:600}
.login input{width:100%}
.login .btn{width:100%;justify-content:center;margin-top:4px}
.login .err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;display:none}
.demo-users{margin-top:20px;border-top:1px solid var(--border);padding-top:16px}
.demo-users .t{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-bottom:8px}
.demo-users .u{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:13px}
.demo-users .u:hover{border-color:var(--accent);background:var(--surface-2)}
.demo-users .u .r{font-size:11px;color:var(--muted)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm)}
.stat .v{font-size:26px;font-weight:800;color:var(--accent);line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px}
.shell .util #logout,.shell .util #reset,.shell .util #theme{font-size:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<header class="shell">
  <div class="logo"><span class="mark">HR</span> HR Module <span class="sub">Human Capital Management</span></div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <div class="util">
    <span id="whoami" class="whoami" style="display:none"></span>
    <button id="reset" title="Reset demo data">↻</button>
    <button id="theme" title="Toggle light / dark">◐</button>
    <button id="logout" title="Sign out" style="display:none">⎋</button>
  </div>
</header>

<main id="app"></main>
<div id="modal-root"></div>
<div id="toasts"></div>

const today=()=>new Date().toISOString().slice(0,10);
const validOn=(rows,pernr,key)=>rows.filter(r=>r.pernr===pernr&&r.begda<=key&&r.endda>=key)
  .sort((a,b)=>a.begda<b.begda?1:-1)[0]||null;
const orgText=(ot,id,key)=>{const o=db.HRP1000.find(x=>x.otype===ot&&x.objid===id&&x.begda<=key&&x.endda>=key);return o?o.stext:null;};
const dom=(d,k)=>db.dom[d]&&db.dom[d][k]||null;
/* Reporting person level: the line manager of an employee. The position reports
   to another position (A 002 S->S); otherwise the org unit's chief (B 012). */
function holderOfPosition(posId,key){const a=db.PA0001.find(x=>x.plans===posId&&x.begda<=key&&x.endda>=key);if(!a)return null;const p=validOn(db.PA0002,a.pernr,key);return p?{pernr:a.pernr,name:p.vorna+" "+p.nachn,pos:orgText("S",posId,key)}:null;}
function lineManager(pernr,key){key=key||today();const a=validOn(db.PA0001,pernr,key);if(!a)return null;
  let mgrPos=null;
  const rel=db.HRP1001.find(r=>r.otype==="S"&&r.objid===a.plans&&r.rsign==="A"&&r.relat==="002"&&r.sclas==="S"&&r.begda<=key&&r.endda>=key);
  if(rel)mgrPos=+rel.sobid;
  if(!mgrPos&&a.orgeh){const ch=db.HRP1001.find(r=>r.otype==="O"&&r.objid===a.orgeh&&r.rsign==="B"&&r.relat==="012"&&r.sclas==="S"&&r.begda<=key&&r.endda>=key);if(ch)mgrPos=+ch.sobid;}
  if(!mgrPos||mgrPos===a.plans)return null;
  return holderOfPosition(mgrPos,key);}
const dayBefore=d=>{const x=new Date(d);x.setDate(x.getDate()-1);return x.toISOString().slice(0,10);};
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5)+1;
const fmtDate=s=>!s?"":s.startsWith("9999")?"unlimited":s.split("-").reverse().join(".");
const fmtAmt=(n,c)=>n==null?"":Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})+(c?" "+c:"");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function getEmployees(search,key){
  key=key||today();
  let list=db.emp.map(em=>{
    const p2=validOn(db.PA0002,em.pernr,key); if(!p2)return null;
    const p1=validOn(db.PA0001,em.pernr,key), p0=validOn(db.PA0000,em.pernr,key);
    const mail=db.PA0105.filter(x=>x.pernr===em.pernr&&x.subty==="0010"&&x.begda<=key&&x.endda>=key)[0];
    return{pernr:em.pernr,fullName:p2.vorna+" "+p2.nachn,
      orgUnitName:p1&&p1.orgeh?orgText("O",p1.orgeh,key):null,
      positionName:p1&&p1.plans?orgText("S",p1.plans,key):null,
      email:mail?mail.usrid:null, status:p0&&p0.stat2?dom("STAT2",p0.stat2):null};
  }).filter(Boolean);
  if(search){const s=search.toLowerCase();
    list=list.filter(e=>e.fullName.toLowerCase().includes(s)||String(e.pernr).includes(s));}
  return list.sort((a,b)=>a.pernr-b.pernr);
}

function hire(f){
  const pernr=++db.nr.PERNR;
  db.emp.push({pernr,hireDate:f.hireDate});
  db.PA0000.push({pernr,begda:f.hireDate,endda:HIGH,stat2:"3"});
  db.PA0001.push({pernr,begda:f.hireDate,endda:HIGH,bukrs:f.companyCode,werks:f.personnelArea,persg:f.employeeGroup,persk:f.employeeSubgroup,orgeh:f.orgUnit||null,plans:null});
  db.PA0002.push({pernr,begda:f.hireDate,endda:HIGH,nachn:f.lastName,vorna:f.firstName,gbdat:f.birthDate||null,gesch:f.gender});
  if(f.email)db.PA0105.push({pernr,subty:"0010",begda:f.hireDate,endda:HIGH,usrid:f.email});
  return pernr;
}
function updatePersonal(pernr,f){
  const cur=db.PA0002.filter(x=>x.pernr===pernr&&x.endda>=f.begda&&x.begda<f.begda).sort((a,b)=>a.begda<b.begda?1:-1)[0];
  if(cur)cur.endda=dayBefore(f.begda);
  db.PA0002.push({pernr,begda:f.begda,endda:HIGH,anred:f.anred,nachn:f.lastName,vorna:f.firstName,gbdat:f.birthDate||null,gesch:f.gender,natio:f.nationality,famst:f.maritalStatus});
}
function reassign(pernr,f){
  const cur=db.PA0001.filter(x=>x.pernr===pernr&&x.endda>=f.begda&&x.begda<f.begda).sort((a,b)=>a.begda<b.begda?1:-1)[0];
  const rec={pernr,begda:f.begda,endda:HIGH,bukrs:cur&&cur.bukrs,werks:cur&&cur.werks,btrtl:cur&&cur.btrtl,
    persg:cur&&cur.persg,persk:cur&&cur.persk,orgeh:f.orgUnit||(cur&&cur.orgeh),plans:f.position||(cur&&cur.plans),
    stell:cur&&cur.stell,kostl:f.costCenter||(cur&&cur.kostl)};
  if(cur)cur.endda=dayBefore(f.begda);
  db.PA0001.push(rec);
}
function leaveBalances(pernr){
  return db.PA2006.filter(q=>q.pernr===pernr).map(q=>({ktart:q.ktart,txt:db.T554S[q.ktart],
    begda:q.begda,endda:q.endda,ent:q.anzhl,ded:q.kverb,rem:q.anzhl-q.kverb}));
}
function recordAbsence(pernr,f){
  if(f.endda<f.begda)throw new Error("End date must not be before start date.");
  const days=f.days!=null&&f.days!==""?Number(f.days):daysBetween(f.begda,f.endda);
  const q=db.PA2006.filter(x=>x.pernr===pernr&&x.ktart===f.absenceType&&x.begda<=f.begda&&x.endda>=f.begda).sort((a,b)=>a.begda<b.begda?1:-1)[0];
  if(q){if(q.anzhl-q.kverb<days)throw new Error("Insufficient leave quota for this absence.");q.kverb+=days;}
  db.PA2001.push({pernr,begda:f.begda,endda:f.endda,awart:f.absenceType,abwtg:days});
  return days;
}
function updateAddress(pernr,f){
  const sub=f.subType||"1";
  const cur=db.PA0006.filter(x=>x.pernr===pernr&&x.subty===sub&&x.endda>=f.begda&&x.begda<f.begda).sort((a,b)=>a.begda<b.begda?1:-1)[0];
  if(cur)cur.endda=dayBefore(f.begda);
  db.PA0006.push({pernr,subty:sub,begda:f.begda,endda:HIGH,stras:f.street,ort01:f.city,pstlz:f.postalCode,land1:f.country,telnr:f.telephone});
}
function addFamily(pernr,f){
  const objs=db.PA0021.filter(x=>x.pernr===pernr&&x.subty===f.relationType).map(x=>parseInt(x.objps,10)||0);
  const next=String((objs.length?Math.max.apply(null,objs):0)+1).padStart(2,"0");
  db.PA0021.push({pernr,subty:f.relationType,objps:next,begda:f.begda||today(),endda:HIGH,fanam:f.lastName,favor:f.firstName,fgbdt:f.birthDate||null,fasex:f.gender,fgbld:f.birthCountry});
}
function recordAttendance(pernr,f){
  if(f.endda<f.begda)throw new Error("End date must not be before start date.");
  const days=f.days!=null&&f.days!==""?Number(f.days):daysBetween(f.begda,f.endda);
  db.PA2002.push({pernr,awart:f.attendanceType,begda:f.begda,endda:f.endda,abwtg:days,stdaz:f.hours?Number(f.hours):null});
  return days;
}
function orgFlat(key){key=key||today();
  return db.HRP1000.filter(o=>o.otype==="O"&&o.begda<=key&&o.endda>=key).map(o=>{
    const r=db.HRP1001.find(x=>x.otype==="O"&&x.sclas==="O"&&x.rsign==="A"&&x.relat==="002"&&x.objid===o.objid&&x.begda<=key&&x.endda>=key);
    return{id:o.objid,name:o.stext,short:o.short,parent:r?+r.sobid:null,children:[]};}).sort((a,b)=>a.id-b.id);
}
function orgTree(key){key=key||today();
  const flat=orgFlat(key),by={};flat.forEach(u=>by[u.id]=u);
  db.PA0001.filter(a=>a.orgeh&&a.begda<=key&&a.endda>=key).forEach(a=>{if(by[a.orgeh])by[a.orgeh].hc=(by[a.orgeh].hc||0)+1;});
  db.HRP1001.filter(r=>r.otype==="O"&&r.rsign==="B"&&r.relat==="012"&&r.sclas==="S"&&r.begda<=key&&r.endda>=key)
    .forEach(r=>{if(by[r.objid])by[r.objid].mgr=orgText("S",+r.sobid,key);});
  const roots=[];flat.forEach(u=>{if(u.parent&&by[u.parent]&&u.parent!==u.id)by[u.parent].children.push(u);else roots.push(u);});
  return roots;
}
function positions(orgFilter,key){key=key||today();
  let list=db.HRP1000.filter(p=>p.otype==="S"&&p.begda<=key&&p.endda>=key).map(p=>{
    const toO=db.HRP1001.find(r=>r.otype==="S"&&r.rsign==="A"&&r.relat==="003"&&r.sclas==="O"&&r.objid===p.objid&&r.begda<=key&&r.endda>=key);
    const toJ=db.HRP1001.find(r=>r.otype==="S"&&r.rsign==="A"&&r.relat==="007"&&r.sclas==="C"&&r.objid===p.objid&&r.begda<=key&&r.endda>=key);
    const h=db.PA0001.filter(a=>a.plans===p.objid&&a.begda<=key&&a.endda>=key).map(a=>{const pd=validOn(db.PA0002,a.pernr,key);return pd?{pernr:a.pernr,name:pd.vorna+" "+pd.nachn}:null;}).filter(Boolean)[0];
    const oid=toO?+toO.sobid:null,jid=toJ?+toJ.sobid:null;
    return{id:p.objid,name:p.stext,orgId:oid,orgN:oid?orgText("O",oid,key):null,jobN:jid?orgText("C",jid,key):null,
      holder:h?h.name:null,vacant:!h};
  });
  if(orgFilter)list=list.filter(p=>String(p.orgId)===String(orgFilter));
  return list.sort((a,b)=>a.id-b.id);
}

function directReports(mgrPernr,key){
  key=key||today();
  // Employees whose position reports to (A 002 S->S) the manager's position, OR same org unit.
  const mp=validOn(db.PA0001,mgrPernr,key); if(!mp)return [];
  const mgrPos=mp.plans, mgrOrg=mp.orgeh;
  const subPos=db.HRP1001.filter(r=>r.otype==="S"&&r.rsign==="A"&&r.relat==="002"&&r.sclas==="S"&&String(r.sobid)===String(mgrPos)&&r.begda<=key&&r.endda>=key).map(r=>r.objid);
  return db.emp.filter(e=>e.pernr!==mgrPernr).map(e=>{const a=validOn(db.PA0001,e.pernr,key),p=validOn(db.PA0002,e.pernr,key);
    if(!a||!p)return null;
    if(subPos.includes(a.plans)||a.orgeh===mgrOrg)return {pernr:e.pernr,name:p.vorna+" "+p.nachn,pos:a.plans?orgText("S",a.plans,key):"",org:a.orgeh?orgText("O",a.orgeh,key):""};
    return null;}).filter(Boolean);
}
function requestLeave(f){
  const emp=validOn(db.PA0002,f.pernr,today());
  const days=f.days!=null&&f.days!==""?Number(f.days):daysBetween(f.begda,f.endda);
  db.leaveRequests.push({id:++db.leaveSeq,pernr:f.pernr,name:emp?emp.vorna+" "+emp.nachn:String(f.pernr),
    type:f.type,begda:f.begda,endda:f.endda,days,status:"Pending",note:f.note||""});
  return days;
}
function decideLeave(id,approve){
  const r=db.leaveRequests.find(x=>x.id===id); if(!r)return;
  if(approve){
    const q=db.PA2006.filter(x=>x.pernr===r.pernr&&x.ktart===r.type&&x.begda<=r.begda&&x.endda>=r.begda).sort((a,b)=>a.begda<b.begda?1:-1)[0];
    if(q){if(q.anzhl-q.kverb<r.days)throw new Error("Insufficient quota to approve this request.");q.kverb+=r.days;}
    db.PA2001.push({pernr:r.pernr,begda:r.begda,endda:r.endda,awart:r.type,abwtg:r.days});
    r.status="Approved";
  }else r.status="Rejected";
}
function bookCourse(pernr,courseId){
  if(db.bookings.find(b=>b.pernr===pernr&&b.course===courseId))throw new Error("Already booked on this course.");
  db.bookings.push({pernr,course:courseId,status:"Confirmed"});
}

/* ============================ EVENTS ============================ */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-nav],[data-open],[data-act],[data-tab],[data-tog],[data-do],[data-close]");
  if(!t)return;
  if(t.dataset.nav){ev.preventDefault();S.view=t.dataset.nav;S.tab="personal";render();return;}
  if(t.dataset.open){S.view="detail";S.pernr=+t.dataset.open;S.tab="personal";render();return;}
  if(t.dataset.tab){S.tab=t.dataset.tab;renderDetail();return;}
  if(t.dataset.tog){const id=+t.dataset.tog;S.open.has(id)?S.open.delete(id):S.open.add(id);renderOrg();return;}
  if(t.dataset.act){
    if(t.dataset.act==="hire")hireDialog();
    else if(t.dataset.act==="edit")editDialog();
    else if(t.dataset.act==="reassign")reassignDialog();
    else if(t.dataset.act==="absence")absenceDialog();
    else if(t.dataset.act==="address")addressDialog();
    else if(t.dataset.act==="family")familyDialog();
    else if(t.dataset.act==="attendance")attendanceDialog();
    else if(t.dataset.act==="reqleave")reqLeaveDialog();
    return;
  }
  if(t.dataset.fill){const u=db.users.find(x=>x.username===t.dataset.fill);if(u){$("#lu").value=u.username;$("#lp").value=u.password;}return;}
  if(t.dataset.approve){try{decideLeave(+t.dataset.approve,true);toast("Leave approved and quota deducted.","good");render();}catch(e){toast(e.message,"bad");}return;}
  if(t.dataset.reject){decideLeave(+t.dataset.reject,false);toast("Leave request rejected.","good");render();return;}
  if(t.dataset.book){try{bookCourse(SESSION.pernr,t.dataset.book);toast("Course booked.","good");render();}catch(e){toast(e.message,"bad");}return;}
  if(t.dataset.advance){advanceApplicant(+t.dataset.advance);toast("Applicant advanced to next stage.","good");render();return;}
  if(t.hasAttribute("data-close")){if(ev.target.closest(".modal")&&!t.hasAttribute("data-close"))return;closeModal();return;}
  if(t.dataset.do){doAction(t.dataset.do);return;}
});

function doAction(kind){
  try{
    if(kind==="hire"){
      const f={firstName:val("h_first").trim(),lastName:val("h_last").trim(),gender:val("h_gender"),
        birthDate:val("h_dob"),email:val("h_email").trim(),hireDate:val("h_hire"),
        companyCode:val("h_cc"),personnelArea:val("h_pa"),employeeGroup:val("h_eg"),
        employeeSubgroup:val("h_es"),orgUnit:val("h_ou")?+val("h_ou"):null};
      if(!f.firstName||!f.lastName||!f.hireDate){toast("Enter first name, last name and hiring date.","bad");return;}
      const pernr=hire(f);closeModal();toast("Employee "+pernr+" hired successfully.","good");
      S.view="detail";S.pernr=pernr;S.tab="personal";render();
    }else if(kind==="edit"){
      const f={begda:val("e_begda"),firstName:val("e_first").trim(),lastName:val("e_last").trim(),
        gender:val("e_gender"),maritalStatus:val("e_marital"),nationality:val("e_natio").trim()};
      if(!f.begda||!f.firstName||!f.lastName){toast("Enter valid-from, first and last name.","bad");return;}
      updatePersonal(S.pernr,f);closeModal();toast("Personal data updated.","good");renderDetail();
    }else if(kind==="reassign"){
      const f={begda:val("r_begda"),orgUnit:val("r_ou")?+val("r_ou"):null,position:val("r_pos")?+val("r_pos"):null,costCenter:val("r_cc").trim()};
      if(!f.begda){toast("Enter a valid-from date.","bad");return;}
      reassign(S.pernr,f);closeModal();toast("Organizational assignment updated.","good");renderDetail();
    }else if(kind==="absence"){
      const f={absenceType:val("a_type"),begda:val("a_begda"),endda:val("a_endda"),days:val("a_days")};
      if(!f.begda||!f.endda){toast("Enter start and end dates.","bad");return;}
      const d=recordAbsence(S.pernr,f);closeModal();toast("Absence recorded ("+d+" day(s)) and deducted from quota.","good");
      S.tab="time";renderDetail();
    }else if(kind==="address"){
      const f={begda:val("ad_begda"),subType:val("ad_sub"),street:val("ad_street").trim(),city:val("ad_city").trim(),postalCode:val("ad_zip").trim(),country:val("ad_ctry").trim()};
      if(!f.begda){toast("Enter a valid-from date.","bad");return;}
      updateAddress(S.pernr,f);closeModal();toast("Address updated.","good");S.tab="contact";renderDetail();
    }else if(kind==="family"){
      const f={relationType:val("fm_rel"),firstName:val("fm_first").trim(),lastName:val("fm_last").trim(),gender:val("fm_gender"),birthDate:val("fm_dob")};
      if(!f.firstName||!f.lastName){toast("Enter first and last name.","bad");return;}
      addFamily(S.pernr,f);closeModal();toast("Family member added.","good");S.tab="family";renderDetail();
    }else if(kind==="attendance"){
      const f={attendanceType:val("at_type"),begda:val("at_begda"),endda:val("at_endda"),hours:val("at_hours")};
      if(!f.begda||!f.endda){toast("Enter start and end dates.","bad");return;}
      const d=recordAttendance(S.pernr,f);closeModal();toast("Attendance recorded ("+d+" day(s)).","good");S.tab="time";renderDetail();
    }else if(kind==="login"){
      const u=val("lu").trim(),pw=val("lp");
      const found=db.users.find(x=>x.username===u&&x.password===pw&&pw);
      if(!found){const e=$("#loginErr");e.textContent="Invalid username or password.";e.style.display="block";return;}
      SESSION={username:found.username,name:found.name,role:found.role,pernr:found.pernr};
      S.view=found.role==="EMPLOYEE"?"ess":found.role==="HR_MANAGER"?"mss":"list";
      toast("Welcome, "+found.name+".","good");render();
    }else if(kind==="reqleave"){
      const f={pernr:SESSION.pernr,type:val("rl_type"),begda:val("rl_begda"),endda:val("rl_endda"),note:val("rl_note").trim()};
      if(!f.begda||!f.endda){toast("Enter start and end dates.","bad");return;}
      if(f.endda<f.begda){toast("End date must not be before start date.","bad");return;}
      const d=requestLeave(f);closeModal();toast("Leave request submitted ("+d+" day(s)).","good");render();
    }
  }catch(err){toast(err.message,"bad");}
}

/* ---- utility buttons ---- */
$("#logout").addEventListener("click",()=>{SESSION=null;S.view="list";S.pernr=null;render();toast("Signed out.","good");});
$("#reset").addEventListener("click",()=>{db=seed();S.view=SESSION?(isEmployee()?"ess":isManager()?"mss":"list"):"list";S.pernr=null;S.search="";S.open=new Set([50000001]);render();toast("Demo data reset to seed.","good");});
(function themeInit(){
  const btn=$("#theme");
  btn.addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const next=cur==="dark"?"light":cur==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");
    document.documentElement.setAttribute("data-theme",next);
  });
})();

render();
</script>
