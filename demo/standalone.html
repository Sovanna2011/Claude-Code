<title>HR Module — HCM Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ===================================================================
   HR Module — self-contained demo (SAP Fiori "Horizon"-inspired)
   All data + business logic run in the browser; nothing is fetched.
   =================================================================== */
:root{
  --accent:#0064d9; --accent-strong:#0a4bb0; --accent-soft:#e5eefc; --shell-bg:#0a4bb0;
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f6f8f9; --surface-3:#eef2f4;
  --border:#d3dbe0; --border-strong:#b9c4cc;
  --text:#1a2733; --muted:#56646f; --faint:#8592a0;
  --good:#107e3e; --good-bg:#e6f3ea; --warn:#c25400; --warn-bg:#fcefe3;
  --bad:#bb0000; --bad-bg:#fbe8e8; --info:#0070f2;
  --shadow-sm:0 1px 2px rgba(20,40,60,.08);
  --shadow:0 2px 4px rgba(20,40,60,.08),0 6px 20px rgba(20,40,60,.06);
  --radius:12px; --radius-sm:8px;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --accent:#4db1ff; --accent-strong:#7cc6ff; --accent-soft:#122a44; --shell-bg:#0c1620;
    --bg:#0f151b; --surface:#1b2531; --surface-2:#202c3a; --surface-3:#25333f;
    --border:#31404e; --border-strong:#425364;
    --text:#e7ecf0; --muted:#9fb0bd; --faint:#6f808e;
    --good:#4bb97a; --good-bg:#12261a; --warn:#f0904a; --warn-bg:#2c1e12;
    --bad:#ff6b6b; --bad-bg:#2c1414; --info:#4db1ff;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 2px 4px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="light"]{
  --accent:#0064d9; --accent-strong:#0a4bb0; --accent-soft:#e5eefc; --shell-bg:#0a4bb0;
  --bg:#eef1f3; --surface:#fff; --surface-2:#f6f8f9; --surface-3:#eef2f4;
  --border:#d3dbe0; --border-strong:#b9c4cc;
  --text:#1a2733; --muted:#56646f; --faint:#8592a0;
  --good:#107e3e; --good-bg:#e6f3ea; --warn:#c25400; --warn-bg:#fcefe3;
  --bad:#bb0000; --bad-bg:#fbe8e8; --info:#0070f2;
  --shadow-sm:0 1px 2px rgba(20,40,60,.08);
  --shadow:0 2px 4px rgba(20,40,60,.08),0 6px 20px rgba(20,40,60,.06);
}
:root[data-theme="dark"]{
  --accent:#4db1ff; --accent-strong:#7cc6ff; --accent-soft:#122a44; --shell-bg:#0c1620;
  --bg:#0f151b; --surface:#1b2531; --surface-2:#202c3a; --surface-3:#25333f;
  --border:#31404e; --border-strong:#425364;
  --text:#e7ecf0; --muted:#9fb0bd; --faint:#6f808e;
  --good:#4bb97a; --good-bg:#12261a; --warn:#f0904a; --warn-bg:#2c1e12;
  --bad:#ff6b6b; --bad-bg:#2c1414; --info:#4db1ff;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 4px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---- ShellBar ---- */
.shell{position:sticky;top:0;z-index:20;background:var(--shell-bg);
  color:#fff;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:6px 16px;min-height:52px;box-shadow:var(--shadow-sm)}
.shell .brandtext{white-space:nowrap}
.shell nav{flex:1 1 auto;overflow:visible;min-width:0}
@media (max-width:760px){
  .shell{gap:8px}
  .shell .logo .sub{display:none}
  .shell nav button{padding:8px 10px;font-size:12.5px}
  .shell nav button svg{display:none}
}
.shell .logo{display:flex;align-items:center;gap:10px;font-weight:700;
  letter-spacing:.2px;white-space:nowrap}
.shell .logo .mark{width:26px;height:26px;border-radius:6px;background:#fff;
  color:var(--accent-strong);display:grid;place-items:center;font-weight:800;font-size:13px}
.shell .sub{font-weight:400;opacity:.8;font-size:12px;border-left:1px solid rgba(255,255,255,.3);
  padding-left:12px;margin-left:2px}
.shell nav{display:flex;gap:2px;margin-left:8px}
.shell nav button{background:transparent;border:0;color:#fff;opacity:.82;
  padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13.5px;font-weight:600;
  display:flex;align-items:center;gap:7px}
.shell nav button:hover{opacity:1;background:rgba(255,255,255,.12)}
.shell nav button.active{opacity:1;background:rgba(255,255,255,.18)}
.shell .spacer{flex:1}
.shell .util{display:flex;gap:6px;align-items:center}
.shell .util button{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:34px;
  border-radius:8px;cursor:pointer;display:grid;place-items:center;font-size:15px}
.shell .util button:hover{background:rgba(255,255,255,.22)}
.shell .util select#lang{background:rgba(255,255,255,.12);border:0;color:#fff;height:34px;border-radius:8px;
  cursor:pointer;font-size:13px;padding:0 6px;font-weight:600}
.shell .util select#lang option{color:#111}
.shell nav svg,.shell .util svg{width:16px;height:16px;fill:currentColor}
.more-wrap{position:relative;flex:0 0 auto}
.morebtn{background:transparent;border:0;color:#fff;opacity:.9;padding:8px 12px;border-radius:7px;
  cursor:pointer;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.morebtn:hover{background:rgba(255,255,255,.14)}
.morebtn svg{width:15px;height:15px;fill:currentColor}
.more-menu{position:absolute;top:120%;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--shadow);min-width:190px;display:none;flex-direction:column;padding:6px;z-index:40}
.more-menu.open{display:flex}
.more-menu .navitem{color:var(--text);opacity:1;background:transparent;justify-content:flex-start;text-align:left;width:100%}
.more-menu .navitem:hover{background:var(--surface-2)}
.more-menu .navitem.active{background:var(--accent-soft);color:var(--accent)}
.more-menu .navitem svg{fill:currentColor}

/* ---- Layout ---- */
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.page-head h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.2px}
.page-head .crumb{font-size:12px;color:var(--muted);margin-bottom:3px;
  text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
input,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 10px}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.search{position:relative;flex:1;min-width:220px}
.search input{width:100%;padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:var(--faint)}

/* ---- Buttons ---- */
.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn svg{width:15px;height:15px;fill:currentColor}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn.xs svg{width:12px;height:12px}
.nowrap{white-space:nowrap}
.muted{color:var(--muted)}

/* ---- Card / table ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);
  background:var(--surface-2)}
.card-head h2{font-size:14px;margin:0;font-weight:700}
.card-head .count{background:var(--accent-soft);color:var(--accent);font-weight:700;
  border-radius:20px;padding:2px 10px;font-size:12px}
.card-head .spacer{flex:1}
.tbl-wrap{overflow-x:auto}
.list-card{overflow:visible}
.dt-search input{border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:8px;padding:6px 10px;font-size:13px;min-width:180px}
.card-head .dt-search{margin-right:6px}
.mtx-legend{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px}
table.mtx th,table.mtx td{text-align:center;padding:4px 6px;font-size:12px}
.mtx-emp{text-align:left !important;white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1}
.mtx thead .mtx-emp{background:var(--surface-2)}
.mtx-day{min-width:30px;line-height:1.1}.mtx-day.we{color:var(--accent)}
.mtx-cell{font-weight:700}
.m-pre{background:rgba(34,160,90,.16);color:#1c9e57}
.m-abs{background:rgba(214,69,69,.16);color:#d64545}
.m-att{background:rgba(11,75,176,.16);color:var(--accent)}
.m-hol{background:rgba(180,120,20,.18);color:#b47814}
.m-off{background:var(--surface-2);color:var(--muted)}
.list-card .card-head{border-radius:var(--radius) var(--radius) 0 0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
  font-weight:700;padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.cols-panel{margin-bottom:14px}
.colmenu-wrap{position:relative;display:inline-block}
.colmenu{position:absolute;top:calc(100% + 4px);right:0;left:auto;z-index:40;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);
  padding:8px;min-width:210px;max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.colchk{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;cursor:pointer;
  color:var(--text);font-size:13.5px;white-space:nowrap}
.colchk input{width:auto;flex:0 0 auto;margin:0}
.colchk:hover{background:var(--surface-2)}
.combo{position:relative}
.combo>input{width:100%;padding-right:30px}
.combo-btn{position:absolute;right:1px;top:1px;bottom:1px;width:28px;background:transparent;border:0;
  color:var(--muted);cursor:pointer;font-size:12px;border-radius:0 8px 8px 0}
.combo-btn:hover{color:var(--text);background:var(--surface-2)}
.combo-btn svg{width:14px;height:14px;fill:currentColor}
.combo-list{margin-top:4px;border:1px solid var(--border);border-radius:8px;background:var(--surface);
  max-height:180px;overflow:auto;display:none}
.combo-list.open{display:block}
.combo-opt{padding:8px 12px;cursor:pointer;font-size:13.5px}
.combo-opt:hover{background:var(--accent-soft)}
.combo-empty{padding:8px 12px;color:var(--muted);font-size:13px}
.rolechks{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.rolechk{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);
  border-radius:8px;background:var(--surface);cursor:pointer;font-size:13.5px}
.th-c,.td-c{text-align:center}
.td-c input{cursor:pointer;width:16px;height:16px}
.cols-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;padding:14px 16px}
.colchip{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);
  border-radius:8px;background:var(--surface);cursor:pointer;font-size:13.5px}
.colchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.colchip input{margin:0}
.filter-row th{padding:6px 10px;background:var(--surface-2);text-transform:none;letter-spacing:0}
.colf{width:100%;min-width:90px;padding:5px 8px;font-size:12px;font-weight:400;
  border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--text)}
.colf:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
tbody tr{cursor:default}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.th-r,.td-r{text-align:right}
.pernr{font-weight:700;color:var(--accent)}
a.mail{color:var(--accent);text-decoration:none}
a.mail:hover{text-decoration:underline}

/* ---- Status pill ---- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);background:var(--good-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.bad{color:var(--bad);background:var(--bad-bg)}
.pill.neutral{color:var(--muted);background:var(--surface-3)}

/* ---- Object header (detail) ---- */
.obj-head{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow-sm);margin-bottom:14px;
  display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.avatar{position:relative;width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:800;font-size:20px;flex:0 0 auto;overflow:visible}
.avatar img{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block}
.avatar .av-edit{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;
  border:2px solid var(--surface);background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.avatar .av-edit svg{width:12px;height:12px;fill:#fff}
.whoami-av{width:30px;height:30px;border-radius:50%;object-fit:cover;cursor:pointer;border:1px solid rgba(255,255,255,.4)}
.whoami-wrap{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid rgba(255,255,255,.3)}
.obj-head .id{margin-left:auto;text-align:right}
.obj-head .id .n{font-size:24px;font-weight:800;color:var(--accent)}
.obj-head .id .l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.obj-head h1{margin:0 0 4px;font-size:22px;letter-spacing:-.3px}
.obj-head .attrs{display:flex;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.obj-head .attrs b{color:var(--text);font-weight:600}

/* ---- Tabs ---- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow:visible;position:relative}
.tab-more-wrap{position:relative;margin-left:auto;align-self:center}
.tab-morebtn{background:transparent;border:0;color:var(--muted);padding:10px 12px;cursor:pointer;
  font-size:13.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;border-bottom:3px solid transparent}
.tab-morebtn:hover{color:var(--text)}
.tab-morebtn.has-active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-more-menu{position:absolute;top:calc(100% + 2px);right:0;z-index:40;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);
  padding:6px;min-width:210px;display:none;flex-direction:column;gap:2px}
.tab-more-menu.open{display:flex}
.tab-more-menu button{border-bottom:0 !important;justify-content:flex-start;border-radius:7px;width:100%}
.tab-more-menu button:hover{background:var(--surface-2)}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);
  padding:10px 14px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap;
  display:flex;align-items:center;gap:8px}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button .ico{width:26px;height:26px;border-radius:50%;background:var(--surface-3);color:var(--muted);
  display:grid;place-items:center}
.tabs button.active .ico{background:var(--accent);color:#fff}
.tabs svg{width:14px;height:14px;fill:currentColor}

/* ---- Definition grid ---- */
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
  font-weight:700;margin:4px 0 10px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 40px}
@media (max-width:680px){.dl{grid-template-columns:1fr}}
.dl .row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--surface-3)}
.dl .row dt{color:var(--muted)}
.dl .row dd{margin:0;font-weight:600;text-align:right}
.subcard{padding:16px 18px}
.subcard+.subcard{border-top:1px solid var(--border)}

/* ---- Org tree ---- */
.tree{padding:6px}
.node{border-radius:var(--radius-sm)}
.node .bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer}
.node .bar:hover{background:var(--surface-2)}
.node .tog{width:18px;height:18px;flex:0 0 auto;display:grid;place-items:center;color:var(--muted);
  transition:transform .15s}
.node.open>.bar .tog{transform:rotate(90deg)}
.node .tog.leaf{visibility:hidden}
.node .oic{width:30px;height:30px;border-radius:7px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;flex:0 0 auto}
.node .oic svg{width:16px;height:16px;fill:currentColor}
.node .meta{display:flex;flex-direction:column}
.node .meta .nm{font-weight:700}
.node .meta .dt{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.node .children{margin-left:26px;padding-left:14px;border-left:1px dashed var(--border-strong);display:none}
.node.open>.children{display:block}
.hc{display:inline-flex;align-items:center;gap:5px;color:var(--info);font-weight:700}
.hc svg{width:13px;height:13px;fill:currentColor}

/* ---- Modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,35,.45);backdrop-filter:blur(2px);
  display:grid;place-items:center;z-index:50;padding:16px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  width:min(520px,100%);max-height:90vh;display:flex;flex-direction:column;animation:pop .18s ease}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--border);font-size:16px}
.modal .body{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal .foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;
  background:var(--surface-2)}
.modal .grp{display:flex;flex-direction:column;gap:5px}
.modal .grp label{font-size:12px;color:var(--muted);font-weight:600}
.modal .grp label .req{color:var(--bad)}
.modal .grp input,.modal .grp select{width:100%}
.modal .grp input[type=checkbox]{width:auto;flex:0 0 auto;margin:0}
.rolechk{cursor:pointer;justify-content:flex-start;text-align:left}
.modal .hint{font-size:12.5px;color:var(--muted);background:var(--surface-3);border-radius:var(--radius-sm);
  padding:9px 12px;display:flex;gap:8px;align-items:flex-start}
.modal .hint svg{width:15px;height:15px;fill:var(--info);flex:0 0 auto;margin-top:1px}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface-3);border-radius:var(--radius-sm);
  padding:9px 12px;display:flex;gap:8px;align-items:flex-start}
.hint svg{width:15px;height:15px;fill:var(--info);flex:0 0 auto;margin-top:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .grp.sec{margin-top:2px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--accent);font-weight:700;border-top:1px solid var(--border);padding-top:12px}

/* ---- Toast ---- */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#0c1620;color:#fff;padding:11px 18px;border-radius:24px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow);display:flex;gap:9px;align-items:center;animation:up .2s ease}
.toast.good{background:var(--good)}.toast.bad{background:var(--bad)}
.toast svg{width:16px;height:16px;fill:currentColor}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

.banner{background:var(--accent-soft);color:var(--accent-strong);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 14px;font-size:12.5px;margin-bottom:14px;display:flex;gap:9px;align-items:center}
:root[data-theme="dark"] .banner{color:var(--accent)}
.banner svg{width:16px;height:16px;fill:currentColor;flex:0 0 auto}
.empty{padding:40px;text-align:center;color:var(--muted)}
.whoami{display:flex;flex-direction:row;align-items:center;gap:9px;line-height:1.15;text-align:left;
  padding-left:12px;border-left:1px solid rgba(255,255,255,.3);white-space:nowrap}
.whoami .wi-txt{display:flex;flex-direction:column}
.whoami b{font-size:12.5px}.whoami span{font-size:11px;opacity:.8}
.rolebadge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
/* Login */
.login-wrap{min-height:calc(100vh - 52px);display:grid;place-items:center;padding:24px}
.login{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
  width:min(400px,100%);padding:30px 28px}
.login .brandrow{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.login .brandrow .mark{width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.login h1{font-size:20px;margin:0}
.login .tag{color:var(--muted);font-size:13px;margin:2px 0 22px}
.login .grp{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.login .grp label{font-size:12px;color:var(--muted);font-weight:600}
.login input{width:100%}
.login .btn{width:100%;justify-content:center;margin-top:4px}
.login .err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;display:none}
.demo-users{margin-top:20px;border-top:1px solid var(--border);padding-top:16px}
.demo-users .t{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-bottom:8px}
.demo-users .u{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:13px}
.demo-users .u:hover{border-color:var(--accent);background:var(--surface-2)}
.demo-users .u .r{font-size:11px;color:var(--muted)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm)}
.stat .v{font-size:26px;font-weight:800;color:var(--accent);line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px}
.shell .util #logout,.shell .util #reset,.shell .util #theme{font-size:16px}
/* Graphical org / reporting charts (boxed tree) */
.chart-scroll{overflow-x:auto;padding:24px 16px}
.orgtree,.orgtree ul{list-style:none;margin:0;padding:0}
.orgtree{display:flex;justify-content:center}
.orgtree ul{display:flex;justify-content:center}
.orgtree li{position:relative;padding:26px 10px 0;text-align:center}
/* connectors */
.orgtree li::before,.orgtree li::after{content:"";position:absolute;top:0;height:26px;width:50%;border-top:2px solid var(--border-strong)}
.orgtree li::before{right:50%;border-right:2px solid var(--border-strong)}
.orgtree li::after{left:50%}
.orgtree li:only-child::before{display:none}
.orgtree li:only-child::after{left:50%;width:0;border-top:0;border-left:2px solid var(--border-strong)}
.orgtree li:first-child::before,.orgtree li:last-child::after{border:0}
.orgtree li:last-child::before{border-right:2px solid var(--border-strong)}
.orgtree>li{padding-top:0}.orgtree>li::before,.orgtree>li::after{display:none}
.orgtree ul::before{content:"";position:absolute;top:0;left:50%;height:26px;border-left:2px solid var(--border-strong)}
.orgtree ul{position:relative;padding-top:26px}
.gbox{display:inline-block;min-width:150px;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:10px;padding:10px 12px;box-shadow:var(--shadow-sm);text-align:left}
.gbox .t{font-weight:700;font-size:13px}.gbox .s{font-size:11px;color:var(--muted);margin-top:2px}
.gorg{border-top:3px solid var(--accent)}
.gper{border-top:3px solid var(--good)}
/* Payslip */
.ps-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ps-sec{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:700;margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
.ps-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.ps-row.tot{border-top:1px solid var(--border);margin-top:4px;font-weight:700}
.ps-row.net{color:var(--good);font-size:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== Reusable data table: global search + per-column filter + sort + column show/hide =====
   cols: [{k,l,v?(row)->text,html?(row)->html,num?,always?}]. State keyed by table id. */
function dtState(id){S.dt=S.dt||{};return S.dt[id]||(S.dt[id]={sort:null,dir:"asc",filters:{},search:"",hidden:[],showCols:false});}
function dtRaw(r,c){const v=c.v?c.v(r):r[c.k];return v==null?"":v;}
function dtApply(id,cols,rows){const st=dtState(id);let data=rows.slice();
  if(st.search){const s=st.search.toLowerCase();data=data.filter(r=>cols.some(c=>String(dtRaw(r,c)).toLowerCase().includes(s)));}
  data=data.filter(r=>cols.every(c=>{const f=(st.filters[c.k]||"").toLowerCase();return !f||String(dtRaw(r,c)).toLowerCase().includes(f);}));
  if(st.sort){const c=cols.find(x=>x.k===st.sort)||{k:st.sort};
    data.sort((a,b)=>{let x=dtRaw(a,c),y=dtRaw(b,c);const nx=parseFloat(x),ny=parseFloat(y);
      if(!isNaN(nx)&&!isNaN(ny)&&String(x).trim()!==""&&String(y).trim()!==""){x=nx;y=ny;}else{x=(""+x).toLowerCase();y=(""+y).toLowerCase();}
      return (x<y?-1:x>y?1:0)*(st.dir==="asc"?1:-1);});}
  return data;}
let _dtReg={};
let _lastCsv="";
function exportCsv(id){const reg=_dtReg[id];if(!reg)return;
  const cols=reg.cols.filter(c=>c.k!=="act"&&c.l);
  const q=s=>{s=(s==null?"":String(s));return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const csv=[cols.map(c=>q(t(c.l))).join(",")].concat(reg.rows.map(r=>cols.map(c=>q(dtRaw(r,c))).join(","))).join("\r\n");
  _lastCsv=csv;
  const fname=(reg.title||id).replace(/[^\w]+/g,"_")+".csv";
  const dataUrl="data:text/csv;charset=utf-8,"+encodeURIComponent("﻿"+csv);
  // Attempt a direct download; also open a modal so it works inside sandboxed viewers.
  try{const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}catch(e){}
  modal("Export to Excel — "+esc(reg.title||id),
    `<div class="hint">${I.info}<span>The file may download automatically. If not, use the download link or copy the data into Excel/Sheets. ${cols.length} column(s), ${reg.rows.length} row(s).</span></div>
     <div class="grp"><a class="btn primary" href="${dataUrl}" download="${esc(fname)}" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px">⭳ Download ${esc(fname)}</a></div>
     <textarea id="csvOut" readonly style="width:100%;height:200px;font-family:ui-monospace,monospace;font-size:12px;white-space:pre;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);padding:8px">${esc(csv)}</textarea>`,
    `<button class="btn" data-copycsv>Copy to clipboard</button><button class="btn ghost" data-close>Close</button>`);
}
function dtTable(id,title,cols,rows,opts){opts=opts||{};const st=dtState(id);

    </div>
    <div class="tbl-wrap"><table><thead><tr>${vis.map(c=>(simple||c.k==="act")?`<th class="${c.k==="act"?"th-r":""}">${esc(t(c.l))}</th>`:`<th class="sortable" data-dtsort="${id}:${c.k}" style="cursor:pointer">${esc(t(c.l))}${st.sort===c.k?(st.dir==="asc"?" ▲":" ▼"):""}</th>`).join("")}</tr>
    ${simple?"":`<tr class="filter-row">${vis.map(c=>c.k==="act"?`<th></th>`:`<th><input class="colf" data-dtfilter="${id}:${c.k}" value="${esc(st.filters[c.k]||"")}" placeholder="🔍"></th>`).join("")}</tr>`}</thead>
    <tbody>${data.length?data.map(r=>`<tr ${opts.rowOpen&&r[opts.rowOpen]!=null?`class="click" data-open="${r[opts.rowOpen]}"`:""}>${vis.map(c=>`<td>${cellHtml(r,c)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${vis.length}"><div class="empty">${esc(t("No records."))}</div></td></tr>`}</tbody></table></div></div>`;}

function renderList(){
  if(!S.colFilters)S.colFilters={};
  const cols=visibleCols();
  let rows=getEmployees(S.search,S.key);
  // Per-column (header-level) filters.
  rows=rows.filter(r=>cols.every(c=>{const f=(S.colFilters[c.k]||"").toLowerCase();
    return !f||String(r[c.k]==null?"":r[c.k]).toLowerCase().includes(f);}));
  const sc=S.sortCol||"pernr", sd=S.sortDir||"asc";
  rows=rows.slice().sort((a,b)=>{let x=a[sc],y=b[sc];
    if(sc==="pernr"){x=+x;y=+y;}else{x=(x==null?"":String(x)).toLowerCase();y=(y==null?"":String(y)).toLowerCase();}
    return (x<y?-1:x>y?1:0)*(sd==="asc"?1:-1);});
  const cell=(r,c)=>{
    if(c.mail)return r.email?`<a class="mail" href="mailto:${esc(r.email)}">${esc(r.email)}</a>`:"—";
    if(c.pill)return `<span class="pill ${r.status==='Active'?'good':r.status==='Inactive'?'warn':'neutral'}">${esc(r.status||"—")}</span>`;
    if(c.date)return esc(fmtDate(r[c.k]));
    if(c.num)return `<span class="pernr num">${esc(r[c.k])}</span>`;
    return esc(r[c.k]||"—");
  };
  _dtReg["emplist"]={cols:cols,rows:rows,title:t("Employees")};
  app.innerHTML=`
  <div class="page-head"><div><div class="crumb">${esc(t("Personnel Administration"))}</div><h1>${esc(t("Employees"))}</h1></div>
    <div style="display:flex;gap:8px">
      ${isAdmin()?`<button class="btn primary" data-act="hire">${I.person} ${esc(t("Hire employee"))}</button>`:""}</div></div>
  <div class="toolbar">
    <div class="search">${I.search}<input id="q" placeholder="${esc(t("Search all columns…"))}" value="${esc(S.search)}"></div>
    <div class="field"><label>${esc(t("Key date"))}</label><input type="date" id="kd" value="${S.key}"></div>
  </div>
  <div class="card list-card">
    <div class="card-head"><h2>${esc(t("Employee list"))}</h2><span class="count">${rows.length}</span><div class="spacer"></div>
      <button class="btn sm" data-dtexport="emplist" title="Export to Excel (CSV)">⭳ Excel</button>
      <div class="colmenu-wrap">
        <button class="btn sm" data-act="cols">${I.doc} ${esc(t("Columns"))} ▾</button>
        ${S.showCols?`<div class="colmenu">${EMP_COLS.map(c=>`<label class="colchk">
          <input type="checkbox" data-col="${c.k}" ${S.empCols.includes(c.k)?"checked":""} ${c.always?"disabled":""}> ${esc(t(c.l))}</label>`).join("")}</div>`:""}
      </div>
    </div>
    <div class="tbl-wrap"><table><thead><tr>
      ${cols.map(c=>`<th class="sortable" data-sort="${c.k}" style="cursor:pointer">${esc(t(c.l))}${sc===c.k?(sd==="asc"?" ▲":" ▼"):""}</th>`).join("")}
    </tr><tr class="filter-row">
      ${cols.map(c=>`<th><input class="colf" data-colfilter="${c.k}" value="${esc(S.colFilters[c.k]||"")}" placeholder="🔍 ${esc(t(c.l))}"></th>`).join("")}
    </tr></thead><tbody>${rows.length?rows.map(r=>`
      <tr class="click" data-open="${r.pernr}">${cols.map(c=>`<td>${cell(r,c)}</td>`).join("")}</tr>`).join("")
      :`<tr><td colspan="${cols.length}"><div class="empty">No employees match your search.</div></td></tr>`}
    </tbody></table></div>
  </div>`;
  const q=$("#q");q.addEventListener("input",e=>{S.search=e.target.value;S.focusField="q";renderList();});
  $("#kd").addEventListener("change",e=>{S.key=e.target.value;renderList();});
  // Per-column header filters (re-render on input, preserve focus + caret).
  app.querySelectorAll(".colf").forEach(inp=>{
    inp.addEventListener("input",e=>{S.colFilters[e.target.dataset.colfilter]=e.target.value;S.focusField="col:"+e.target.dataset.colfilter;renderList();});
  });
  // Restore focus to whichever search field was being typed in.
  let target=null;
  if(S.focusField==="q")target=q;
  else if(S.focusField&&S.focusField.startsWith("col:"))target=app.querySelector('.colf[data-colfilter="'+S.focusField.slice(4)+'"]');
  else target=q;
  if(target){target.focus();const val=target.value;target.value="";target.value=val;}
}

/* Priority+ detail tabs: overflow tabs collapse into a "More ▾" dropdown. */
function fitTabs(){
  const bar=document.getElementById("detailTabs");if(!bar)return;
  const wrap=bar.querySelector(".tab-more-wrap"),menu=document.getElementById("tabMoreMenu");if(!wrap)return;
  menu.innerHTML="";wrap.style.display="none";
  const items=[...bar.querySelectorAll("button[data-tab]")];items.forEach(b=>b.style.display="");
  if(bar.scrollWidth<=bar.clientWidth+1)return;
  wrap.style.display="";
  const avail=bar.clientWidth-wrap.offsetWidth-6;let used=0,anyActive=false;
  for(const b of items){used+=b.offsetWidth+4;
    if(used>avail){b.style.display="none";const c=b.cloneNode(true);c.style.display="";if(c.classList.contains("active"))anyActive=true;menu.appendChild(c);}}
  wrap.querySelector(".tab-morebtn").classList.toggle("has-active",anyActive);
}

function directReports(mgrPernr,key){

  return db.emp.filter(e=>e.pernr!==mgrPernr).map(e=>{const a=validOn(db.PA0001,e.pernr,key),p=validOn(db.PA0002,e.pernr,key);

/* ============================ REPORTS & PAYROLL LOGIC ============================ */
const empName=pernr=>{const p=validOn(db.PA0002,pernr,today());return p?p.vorna+" "+p.nachn:String(pernr);};
function otCategory(dateStr){
  if(db.publicHolidays.includes(dateStr))return "holiday";
  return new Date(dateStr+"T00:00:00").getDay()===0?"sunday":"normal";
}
/* Overtime report: per employee, hours split by category over [from,to]. */
function overtimeReport(from,to){
  const inRange=d=>(!from||d>=from)&&(!to||d<=to);
  const byEmp={};
  db.overtime.filter(o=>inRange(o.date)).forEach(o=>{
    const e=byEmp[o.pernr]||(byEmp[o.pernr]={pernr:o.pernr,name:empName(o.pernr),normal:0,sunday:0,holiday:0});
    e[otCategory(o.date)]+=o.hours;
  });
  return Object.values(byEmp).map(e=>({...e,total:e.normal+e.sunday+e.holiday})).sort((a,b)=>a.pernr-b.pernr);
}
/* Attendance report (IT2002) over a date range, all employees. */
function attendanceReport(from,to){
  const overlaps=(b,e)=>(!to||b<=to)&&(!from||e>=from);
  return db.PA2002.filter(a=>overlaps(a.begda,a.endda)).map(a=>({
    pernr:a.pernr,name:empName(a.pernr),type:db.T554S[a.awart]||a.awart,begda:a.begda,endda:a.endda,days:a.abwtg,hours:a.stdaz
  })).sort((a,b)=>a.begda<b.begda?1:-1);
}
/* Daily attendance matrix: rows = employees, columns = each day in the range.
   Cell status per day: absence (IT2001) > attendance (IT2002) > holiday > weekend > present. */
function attendanceMatrix(from,to){
  const days=[];let d=new Date(from+"T00:00:00"),end=new Date(to+"T00:00:00");
  while(d<=end){const iso=d.toISOString().slice(0,10),dow=d.getDay();
    days.push({iso,dom:iso.slice(8),wd:["Su","Mo","Tu","We","Th","Fr","Sa"][dow],weekend:dow===0||dow===6,holiday:db.publicHolidays.includes(iso)});
    d.setDate(d.getDate()+1);}
  const rows=db.emp.map(e=>{
    const abs=db.PA2001.filter(a=>a.pernr===e.pernr),att=db.PA2002.filter(a=>a.pernr===e.pernr);
    const cells=days.map(day=>{
      const a=abs.find(x=>x.begda<=day.iso&&x.endda>=day.iso);
      if(a)return {code:"A",cls:"m-abs",title:(db.T554S[a.awart]||"Absence")};
      const t=att.find(x=>x.begda<=day.iso&&x.endda>=day.iso);
      if(t)return {code:"T",cls:"m-att",title:(db.T554S[t.awart]||"Attendance")};
      if(day.holiday)return {code:"H",cls:"m-hol",title:"Public holiday"};
      if(day.weekend)return {code:"·",cls:"m-off",title:"Non-working day"};
      return {code:"P",cls:"m-pre",title:"Present"};});
    return {pernr:e.pernr,name:empName(e.pernr),cells};});
  return {days,rows};
}
/* Payslip: gross (base + OT) − deductions (tax + social) = net. */
function payslip(pernr,from,to){
  const p8=validOn(db.PA0008,pernr,to||today());
  const p7=validOn(db.PA0007,pernr,to||today());
  const annual=p8?p8.ansal||0:0, base=annual/12;
  const weekly=p7&&p7.wostd?p7.wostd:40;
  const hourly=base/(weekly*db.payroll.monthlyFactor);
  const ot=overtimeReport(from,to).find(x=>x.pernr===pernr)||{normal:0,sunday:0,holiday:0};
  const m=db.payroll.otMult;
  const otPay={normal:ot.normal*hourly*m.normal,sunday:ot.sunday*hourly*m.sunday,holiday:ot.holiday*hourly*m.holiday};
  const otTotal=otPay.normal+otPay.sunday+otPay.holiday;
  const gross=base+otTotal;
  const tax=gross*db.payroll.taxRate, social=gross*db.payroll.socialRate;
  const net=gross-tax-social;
  return {pernr,name:empName(pernr),currency:p8?p8.waers||"EUR":"EUR",base,hourly,ot,otPay,otTotal,gross,tax,social,net};
}
/* Number of working days in a period (weekdays minus public holidays). */
function workingDays(from,to){
  if(!from||!to)return 0;
  let d=new Date(from+"T00:00:00"),end=new Date(to+"T00:00:00"),n=0;
  while(d<=end){const iso=d.toISOString().slice(0,10),dow=d.getDay();
    if(dow!==0&&dow!==6&&!db.publicHolidays.includes(iso))n++;
    d.setDate(d.getDate()+1);}
  return n;
}
function payrollRun(from,to){const wd=workingDays(from,to);return db.emp.map(e=>Object.assign(payslip(e.pernr,from,to),{workingDays:wd})).sort((a,b)=>a.pernr-b.pernr);}

function cfgStore(def){return def.store==="dom"?db.dom[def.path]:db[def.path];}
function cfgRows(def){const s=cfgStore(def);
  if(def.store==="arr")return s.map(o=>Object.assign({key:o[def.keyF]},o));
  return Object.entries(s).map(([k,v])=>typeof v==="object"?Object.assign({key:k},v):{key:k,text:v});}
function cfgGet(def,key){const s=cfgStore(def);
  if(def.store==="arr"){const o=s.find(x=>String(x[def.keyF])===String(key));return o?Object.assign({key},o):null;}
  const v=s[key];if(v==null)return null;return typeof v==="object"?Object.assign({key},v):{key,text:v};}
function cfgUpsert(def,oldKey,key,data){const s=cfgStore(def);
  if(key==null||key===""){ // auto key
    const keys=Object.keys(s).map(Number).filter(n=>!isNaN(n));
    key=String((keys.length?Math.max.apply(null,keys):0)+1).padStart(2,"0");}
  if(def.store==="arr"){
    if(oldKey!=null){const o=s.find(x=>String(x[def.keyF])===String(oldKey));if(!o)throw new Error("Entry not found.");Object.assign(o,{[def.keyF]:key},data);}
    else{if(s.find(x=>String(x[def.keyF])===String(key)))throw new Error("Entry already exists.");s.push(Object.assign({[def.keyF]:key},data));}
    return;}
  if(oldKey==null&&s[key]!=null)throw new Error("Entry already exists.");
  if(oldKey!=null&&String(oldKey)!==String(key))delete s[oldKey];
  const onlyText=def.fields.length===1&&def.fields[0].k==="text";
  s[key]=onlyText?data.text:Object.assign({},data);
  if(def.rel){db[def.rel.path]=db[def.rel.path]||{};
    if(oldKey!=null&&String(oldKey)!==String(key))delete db[def.rel.path][oldKey];
    db[def.rel.path][key]=data[def.rel.k]||"";}}
function cfgRemove(def,key){const s=cfgStore(def);
  if(def.store==="arr"){const i=s.findIndex(x=>String(x[def.keyF])===String(key));if(i>=0)s.splice(i,1);}
  else delete s[key];
  if(def.rel&&db[def.rel.path])delete db[def.rel.path][key];}
function cfgLabel(src,key){if(!key)return "—";const m=db[src]||db.dom[src]||{};const v=m[key];
  const t=v&&typeof v==="object"?(v.name||v.text||""):v;return esc(key+(t?" – "+t:""));}
function cfgLabelText(src,key){if(!key)return "";const m=db[src]||db.dom[src]||{};const v=m[key];
  const t=v&&typeof v==="object"?(v.name||v.text||""):v;return key+(t?" – "+t:"");}
function cfgTable(tab){const def=CFG_SCHEMA[tab];const rows=cfgRows(def);
  const relMap=def.rel?(db[def.rel.path]||{}):null;
  const cols=[{k:"key",l:def.keyL,always:true}];
  def.fields.forEach(f=>{
    if(f.src)cols.push({k:f.k,l:f.l,v:r=>cfgLabelText(f.src,r[f.k]),html:r=>cfgLabel(f.src,r[f.k])});
    else cols.push({k:f.k,l:f.l});
  });
  if(def.rel)cols.push({k:def.rel.k,l:def.rel.l,v:r=>cfgLabelText(def.rel.src,relMap[r.key]),html:r=>cfgLabel(def.rel.src,relMap[r.key])});
  cols.push({k:"act",l:"Actions",always:true,html:r=>`<button class="btn xs" data-cfgedit="${tab}" data-key="${esc(r.key)}">${I.edit} Edit</button> <button class="btn xs ghost" data-cfgdel="${tab}" data-key="${esc(r.key)}">Delete</button>`});
  return dtTable("cfg_"+tab,def.h,cols,rows,{actions:`<button class="btn sm primary" data-cfgadd="${tab}">+ Add</button>`});}

function orgBox(n){return `<li><div class="gbox gorg"><div class="t">${esc(n.name)}</div>

/* ---- Graphical reporting line (people hierarchy) ---- */
function buildReportTree(key){
  key=key||today();
  const people=db.emp.map(e=>{const p=validOn(db.PA0002,e.pernr,key),a=validOn(db.PA0001,e.pernr,key);
    return p?{pernr:e.pernr,name:p.vorna+" "+p.nachn,pos:a&&a.plans?orgText("S",a.plans,key):"",mgr:(lineManager(e.pernr,key)||{}).pernr||null,children:[]}:null;}).filter(Boolean);
  const by={};people.forEach(p=>by[p.pernr]=p);const roots=[];
  people.forEach(p=>{if(p.mgr&&by[p.mgr])by[p.mgr].children.push(p);else roots.push(p);});
  return roots;
}
function personBox(n){return `<li><div class="gbox gper"><div class="t">${esc(n.name)}</div><div class="s">${esc(n.pos)}</div><div class="s num">#${n.pernr}</div></div>
  ${n.children.length?`<ul>${n.children.map(personBox).join("")}</ul>`:""}</li>`;}
function renderReportGraph(){
  const roots=buildReportTree(S.key);
  app.innerHTML=pageHead("Organizational Management","Reporting line",
    `<button class="btn" data-nav="orggraph">${I.org} Org chart</button>`)+
    `<div class="card"><div class="chart-scroll"><ul class="orgtree">${roots.map(personBox).join("")}</ul></div></div>`;
}

/* Reusable city search-list (combobox). Filters by an optional country select and
   the typed text; renders in-flow so it is never clipped by the scrolling modal. */
function cityMatches(ctry,q){q=(q||"").toLowerCase();
  return Object.keys(db.cities).filter(n=>(!ctry||(db.cities[n]&&db.cities[n].country)===ctry)&&n.toLowerCase().includes(q));}
function cityDrop(inputId,dropId,ctryId,q){
  const inp=document.getElementById(inputId),drop=document.getElementById(dropId);
  const ctry=ctryId&&document.getElementById(ctryId)?document.getElementById(ctryId).value:"";
  if(!inp||!drop)return;
  const list=cityMatches(ctry,q==null?inp.value:q);
  drop.innerHTML=list.length?list.map(n=>{const r=db.cities[n];
    return `<div class="combo-opt" data-cityopt="${esc(n)}" data-target="${inputId}">${esc(n)}${r&&r.region?` <span class="muted">· ${esc(r.region)}</span>`:""}${r&&r.postal?` <span class="muted">${esc(r.postal)}</span>`:""}</div>`;}).join("")
    :`<div class="combo-empty">No matching city — free text allowed</div>`;}
function openCityDrop(inputId,dropId,ctryId,q){cityDrop(inputId,dropId,ctryId,q);const d=document.getElementById(dropId);if(d)d.classList.add("open");}

/* ============================ TOAST ============================ */
function toast(msg,kind){
  const t=document.createElement("div");t.className="toast "+(kind||"");
  t.innerHTML=(kind==="good"?I.check:kind==="bad"?I.warn:I.info)+"<span>"+esc(msg)+"</span>";
  $("#toasts").appendChild(t);setTimeout(()=>t.remove(),2800);
}

/* ============================ EVENTS ============================ */
document.addEventListener("click",ev=>{
  // City search-list (combobox): toggle, select, and outside-click close.
  if(!ev.target.closest(".combo"))document.querySelectorAll(".combo-list.open").forEach(d=>d.classList.remove("open"));
  const comboToggle=ev.target.closest("[data-citytoggle]");
  if(comboToggle){const combo=comboToggle.closest(".combo"),inp=combo.querySelector("input"),list=combo.querySelector(".combo-list");
    if(list.classList.contains("open"))list.classList.remove("open");else openCityDrop(inp.id,list.id,combo.dataset.ctry||null,"");
    inp.focus();return;}
  const comboOpt=ev.target.closest("[data-cityopt]");

      const f={attendanceType:val("at_type"),begda:val("at_begda"),endda:val("at_endda"),hours:val("at_hours")};
      if(!f.begda||!f.endda){toast("Enter start and end dates.","bad");return;}
      const d=recordAttendance(S.pernr,f);closeModal();toast("Attendance recorded ("+d+" day(s)).","good");S.tab="time";renderDetail();
    }else if(kind==="login"){
      const u=val("lu").trim(),pw=val("lp");
      const found=db.users.find(x=>x.username===u&&x.password===pw&&pw);
      if(!found){const e=$("#loginErr");e.textContent="Invalid username or password.";e.style.display="block";return;}
      const roles=found.roles||[found.role];
      const primary=roles.includes("HR_ADMIN")?"HR_ADMIN":roles.includes("HR_MANAGER")?"HR_MANAGER":roles[0];
      SESSION={username:found.username,name:found.name,roles:roles,role:primary,pernr:found.pernr,email:found.email};
      if(found.theme){document.documentElement.setAttribute("data-theme",found.theme);}
      S.view=primary==="HR_ADMIN"?"list":primary==="HR_MANAGER"?"mss":(found.pernr?"ess":"list");
      toast("Welcome, "+found.name+".","good");render();
    }else if(kind==="reqleave"){
      const f={pernr:SESSION.pernr,type:val("rl_type"),begda:val("rl_begda"),endda:val("rl_endda"),note:val("rl_note").trim()};
      if(!f.begda||!f.endda){toast("Enter start and end dates.","bad");return;}
      if(f.endda<f.begda){toast("End date must not be before start date.","bad");return;}
      const d=requestLeave(f);closeModal();toast("Leave request submitted ("+d+" day(s)).","good");render();
    }
  }catch(err){toast(err.message,"bad");}
}

/* ---- utility buttons ---- */
$("#logout").addEventListener("click",()=>{SESSION=null;S.view="list";S.pernr=null;render();toast("Signed out.","good");});
$("#reset").addEventListener("click",()=>{db=seed();S.view=SESSION?(isEmployee()?"ess":isManager()?"mss":"list"):"list";S.pernr=null;S.search="";S.open=new Set([50000001]);render();toast("Demo data reset to seed.","good");});
(function themeInit(){
  const btn=$("#theme");
  btn.addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const next=cur==="dark"?"light":cur==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");
    document.documentElement.setAttribute("data-theme",next);
  });
})();
(function langInit(){
  const sel=$("#lang");if(!sel)return;
  sel.value=LANG;
  sel.addEventListener("change",e=>{LANG=e.target.value;render();});
})();

render();
</script>
