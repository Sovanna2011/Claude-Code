# Sugar Production Planning - Thai (ภาษาไทย)
#
# Every key in i18n.properties has a translation here. A key that is absent
# would fall back to English, which is why the CI check holds this file to the
# English source in both directions: an orphan key is dead weight, and a
# missing one is a Thai screen with an English sentence in the middle of it.
#
# The industry vocabulary follows Thai mill usage: อ้อย for cane, น้ำตาลทรายดิบ
# for raw sugar, การหีบอ้อย for crushing, ประสิทธิภาพการหีบสกัด for recovery. A
# mill's own house terms may differ, and those are the words worth reviewing
# with the people who will read this screen every morning.

