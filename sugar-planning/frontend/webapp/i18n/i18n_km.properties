# Sugar Production Planning - Khmer (ភាសាខ្មែរ)
#
# Every key in i18n.properties has a translation here. A key that is absent
# would fall back to English, which is why the CI check holds this file to the
# English source in both directions: an orphan key is dead weight, and a
# missing one is a Khmer screen with an English sentence in the middle of it.
#
# The industry vocabulary follows Cambodian mill usage: អំពៅ for cane, ស្ករឆៅ
# for raw sugar, ការកិនអំពៅ for crushing, អត្រាទាញយកស្ករ for recovery. A mill's
# own house terms may differ, and those are the words worth reviewing with the
# people who will read this screen every morning.

